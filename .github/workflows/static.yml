# 웹사이트 자동 배포 (GitHub Pages)
# 'Static HTML' 기본 틀을 두 단계(build → deploy)로 나눈 것 — 가끔 나는 'No artifacts named github-pages' 오류를 피해요
name: Deploy static content to Pages

on:
  # main에 push하면 자동으로 실행
  push:
    branches: ["main"]
  # Actions 화면의 'Run workflow' 버튼으로도 실행
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1단계: 파일 묶어서 올리기
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  # 2단계: 웹사이트로 내보내기
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
