<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오한빈 소개</title>
  <style>
    body { margin: 0; font-family: 'Malgun Gothic', sans-serif; background: #FFF7EC; color: #222; }
    .card { max-width: 560px; margin: 60px auto; padding: 40px 32px; background: #fff;
            border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.08); text-align: center; }
    .face { font-size: 72px; }
    h1 { margin: 10px 0 6px; font-size: 34px; }
    .hello { color: #666; font-size: 18px; line-height: 1.6; }
    ul { list-style: none; padding: 0; margin: 28px 0; text-align: left; }
    li { background: #FFF1DC; border-radius: 14px; padding: 14px 18px; margin: 10px 0; font-size: 17px; }
    .btn { display: inline-block; background: #FF7A00; color: #fff; text-decoration: none;
           padding: 14px 28px; border-radius: 999px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <div class="face">🙋</div>
    <!-- ① 이름 -->
    <h1>오한빈</h1>
    <!-- ② 한 줄 소개 -->
    <p class="hello">AI를 쉽게 알려 드리는 강사입니다.<br>오늘 처음으로 제 웹사이트를 만들었어요!</p>
    <!-- ③ 하는 일 3가지 -->
    <ul>
      <li>💡 AI 활용 특강</li>
      <li>🛠️ 업무 자동화 도우미 만들기</li>
      <li>🌐 나만의 웹사이트 만들기</li>
    </ul>
    <!-- ④ 버튼 (글자와 주소) -->
    <a class="btn" href="https://aicoder.kr">강의 문의하기</a>
  </div>
</body>
</html>
